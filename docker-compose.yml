version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: opinion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opinion_db}
      POSTGRES_USER: ${POSTGRES_USER:-opinion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opinion_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opinion_user} -d ${POSTGRES_DB:-opinion_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
